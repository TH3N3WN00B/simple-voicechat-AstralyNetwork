name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '[0-9]*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['1.20.1', '1.21.1', '1.21.4', '1.21.5', '1.21.8', '1.21.10', '1.21.11', '26.1', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build ${{ matrix.version }}
        shell: bash
        run: |
          for i in $(seq 1 3); do
            if ./build-all.sh ${{ matrix.version }}; then
              exit 0
            fi
            echo "Build attempt $i failed, retrying in 30s..."
            sleep 30
          done
          exit 1
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simple-voicechat-${{ matrix.version }}
          path: dist/${{ matrix.version }}/*.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: simple-voicechat-*
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true
